<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Review</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            color: #5A7D7C;
            background-color: #E6F1F2;
        }
        .review-content {
            background-color: white;
            padding: 15px;
            border-radius: 5px;
        }
        .report-options {
            background-color: white;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }
        button {
            background-color: #FA8E61;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Report Review</h1>
    
    <div class="review-content">
        <!-- Review being reported will go here -->
    </div>
    
    <div class="report-options">
        <!-- Report options will go here -->
    </div>
    
    <button>Submit Report</button>
</body>
</html>
